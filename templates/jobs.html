{% extends "base.html" %}
{% block title %}{{ 'Job Market' if demo_role == 'employer' else 'Discover Jobs' }} — JOBFLEX{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/applications-reference.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/discover-jobs-reference.css') }}">
{% endblock %}

{% block content %}{% include "seeker/_discover_jobs_content.html" %}{% endblock %}

{% block scripts %}
<script id="jobflex-bootstrap-data" type="application/json">
{
  "jobs": {{ jobs_json | tojson }},
  "saved": {{ saved_ids | tojson }},
  "applied": {{ applied_ids | tojson }},
  "role": {{ demo_role | default('guest', true) | tojson }},
  "filters": {
    "locations": {{ locations | tojson }},
    "industries": {{ industries | tojson }},
    "jobTypes": {{ job_types | tojson }},
    "workModes": {{ work_modes | tojson }},
    "experienceLevels": {{ experience_levels | tojson }}
  }
}
</script>
<script>
(function() {
  const data = JSON.parse(document.getElementById('jobflex-bootstrap-data')?.textContent || document.getElementById('nexora-bootstrap-data')?.textContent || '{}');
  window.JOBFLEX_JOBS = window.NEXORA_JOBS = data.jobs || [];
  window.JOBFLEX_SAVED = window.NEXORA_SAVED = data.saved || [];
  window.JOBFLEX_APPLIED = window.NEXORA_APPLIED = data.applied || [];
  window.JOBFLEX_ROLE = window.NEXORA_ROLE = data.role || 'guest';
  window.JOBFLEX_PREVIEW = window.NEXORA_PREVIEW = false;
  window.JOBFLEX_FILTER_OPTIONS = window.NEXORA_FILTER_OPTIONS = data.filters || {};
})();
</script>
<script src="{{ url_for('static', filename='js/discover-jobs-reference.js') }}"></script>
<script>document.addEventListener('DOMContentLoaded', function () { if (window.lucide) window.lucide.createIcons(); });</script>
{% endblock %}
